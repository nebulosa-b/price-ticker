name: tick
on:
  schedule:
    - cron: '*/5 * * * *' # GitHub's minimum; often late or skipped
  workflow_dispatch:
concurrency: tick # never two runs at once (no double posts)
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
      # one post per minute: 5 posts per run
      - run: |
          for i in 1 2 3 4 5; do
            npx tgcloud run endpoints/tick "{ channel: '$CHANNEL' }" || true
            npx tgcloud run endpoints/tick "{ channel: '@rheausdprices', coin: 'RHEA' }" || true
            [ $i -eq 5 ] || sleep 55
          done
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
