name: tick
# Triggered every minute by cron-job.org via the workflow_dispatch API
# (GitHub's own cron is limited to 5 min and fires late or not at all).
on: workflow_dispatch
concurrency: tick # never two runs at once (no double posts)
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
      - run: |
          npx tgcloud run endpoints/tick "{ channel: '$CHANNEL' }"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
