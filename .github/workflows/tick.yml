name: tick
on:
  schedule:
    - cron: '*/5 * * * *' # GitHub's minimum; each run posts 5 times, one per minute
  workflow_dispatch:
concurrency: tick # never two runs at once (no double posts)
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: |
          for i in 1 2 3 4 5; do
            npx tgcloud run endpoints/tick "{ channel: '$CHANNEL' }" || true
            [ $i -lt 5 ] && sleep 55
          done
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
